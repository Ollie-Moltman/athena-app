name: athena
description: "Project Athena — AI Video Detection (on-device, no backend)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # Image processing (frame analysis for on-device detection)
  image: ^4.2.0

  # Screen capture permission
  permission_handler: ^11.3.1

  # On-device storage for scan history
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
